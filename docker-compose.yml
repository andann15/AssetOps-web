services:
  minio:
    image: minio/minio:latest
    container_name: assetops-minio
    ports:
      - "9000:9000" # Port untuk API (S3 Endpoint)
      - "9001:9001" # Port untuk Web Console
    environment:
      MINIO_ROOT_USER: minioadmin # Sesuai dengan AWS_ACCESS_KEY_ID di .env
      MINIO_ROOT_PASSWORD: minioadmin123 # Sesuai dengan AWS_SECRET_ACCESS_KEY di .env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # Perintah otomatis untuk membuat bucket saat container pertama kali berjalan
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/assetops-bucket;
      /usr/bin/mc anonymous set public myminio/assetops-bucket;
      exit 0;
      "

volumes:
  minio_data:
